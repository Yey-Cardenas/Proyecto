schema: spec-driven

context: |
  Sistema de Gestión de Programas Sociales de Huamanga (Vaso de Leche y Comedores Populares).
  Stack obligatorio: C# / ASP.NET Core MVC (.NET 10), vistas Razor + HTML5 + CSS3 + Bootstrap,
  Entity Framework Core 10 con Microsoft SQL Server, ASP.NET Core Identity, IMemoryCache.
  Pruebas: xUnit + Coverlet. Documentación de API: Swagger/OpenAPI (Swashbuckle).
  Estilo: monolito modular con MVC (Controlador -> Servicio -> Unit of Work/Repositorio -> EF Core).
  NO usar Node, Express, Prisma, React, PostgreSQL ni Azure SQL. NO microservicios.
  Escribir todos los artefactos en español.
  Respetar los documentos en arquitectura/ y analisis-de-sistema/.

rules:
  tasks:
    - Cada tarea debe indicar el módulo y los RF/RNF que cubre.
    - Incluir tareas de pruebas xUnit por cada servicio de negocio.
  design:
    - Declarar explícitamente qué decisión de arquitectura/ se respeta.